```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Fhobs Solutions account password securely.">
  <title>Forgot Password - Fhobs Solutions</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <h2>Forgot Password?</h2>

    <p class="subtitle">
      No worries! Enter the email address associated with
      your account and we'll help you reset your password.
    </p>

    <div id="alert" class="alert" role="status"
         aria-live="polite" hidden></div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your registered email"
          autocomplete="email"
          required
        >
      </div>

      <button type="submit" id="resetButton">
        Send Reset Link
      </button>
    </form>

    <div class="links">
      <p>Remembered your password?</p>
      <a href="login.html">Back to Login</a>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
```
